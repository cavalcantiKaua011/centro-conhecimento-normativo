<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Conhecimento Normativo — Administração</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="ckn-shell">

    <!-- Sidebar -->
    <aside class="ckn-sidebar" id="ckn-sidebar">
      <!-- Renderizado por CKN_Layout -->
    </aside>

    <!-- Overlay mobile -->
    <div class="ckn-overlay" id="ckn-overlay"></div>

    <!-- Main -->
    <div class="ckn-main">

      <!-- Topbar -->
      <header class="ckn-topbar" id="ckn-topbar">
        <!-- Renderizado por CKN_Layout -->
      </header>

      <!-- Content -->
      <main id="ckn-content">
        <!-- Renderizado pelo roteador -->
      </main>

    </div>
  </div>

  <!--
    ============================================================
    SCRIPTS
    Ordem de carregamento OBRIGATÓRIA:
    1. data.js    — CKN_DATA (fonte publicada)
    2. store.js   — CKN_STORE (abstração de armazenamento admin)
    3. common.js  — utilitários
    4. layout.js  — sidebar/topbar
    5. páginas    — componentes de cada rota
    6. app.js     — roteador central (inicializa por último)
    ============================================================
  -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/common.js"></script>
  <script src="js/components/layout.js"></script>
  <script src="js/pages/Normas.js"></script>
  <script src="js/pages/NormaDetail.js"></script>
  <script src="js/pages/Processos.js"></script>
  <script src="js/pages/ProcessoDetail.js"></script>
  <script src="js/app.js"></script>

  <!-- Inicialização -->
  <script>
    // Inicializa em modo ADMINISTRATIVO
    CKN_App.init(true);
  </script>

</body>
</html>
